name: Build & Screenshot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-screenshot:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Available Xcode installs:"
          ls -d /Applications/Xcode*.app
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i simulator

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Everywhere.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache Xcode build products (incremental build)
        uses: actions/cache@v4
        with:
          path: |
            DerivedData/Build
            DerivedData/ModuleCache.noindex
          key: build-${{ runner.os }}-${{ hashFiles('Everywhere/**/*.swift', 'EverywhereNE/**/*.swift', 'Shared/**/*.swift', 'Everywhere.xcodeproj/project.pbxproj') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Install xcodeproj gem
        run: gem install --user-install xcodeproj

      - name: Wire project (SwiftPM deps, zashboard resource, build settings)
        run: ruby Scripts/wire_project.rb

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project Everywhere.xcodeproj \
            -scheme Everywhere \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator (reuse pre-provisioned device if possible)
        id: sim
        run: |
          set -euo pipefail
          RUNTIME_ID=$(xcrun simctl list runtimes available -j | \
            jq -r '[.runtimes[] | select(.name | startswith("iOS"))] | sort_by(.version) | last | .identifier')
          echo "Runtime: $RUNTIME_ID"

          # Runner images ship with a handful of simulators already created for the
          # default Xcode — booting one of those skips the ~60-70s first-boot data
          # migration that `simctl create` pays on a brand new device. Fall back to
          # creating one if none exist for the runtime we picked (e.g. it's newer
          # than the image's bundled default).
          UDID=$(xcrun simctl list devices available -j | \
            jq -r --arg rid "$RUNTIME_ID" \
            '.devices[$rid] // [] | map(select(.name | startswith("iPhone"))) | .[0].udid // empty')

          if [ -z "$UDID" ]; then
            echo "No pre-provisioned device for $RUNTIME_ID — creating one."
            DEVICE_TYPE_ID=$(xcrun simctl list runtimes available -j | \
              jq -r --arg rid "$RUNTIME_ID" \
              '.runtimes[] | select(.identifier==$rid) | .supportedDeviceTypes | map(select(.name | startswith("iPhone"))) | last | .identifier')
            echo "DeviceType: $DEVICE_TYPE_ID"
            UDID=$(xcrun simctl create STVPN-CI "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          else
            echo "Reusing pre-provisioned device: $UDID"
          fi

          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install & launch app
        id: launch
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP_PATH=$(find DerivedData -name "Everywhere.app" -path "*iphonesimulator*" -print -quit)
          echo "App path: $APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"

          is_running() {
            xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "com.stservice.stvpn"
          }

          xcrun simctl launch "$UDID" com.stservice.stvpn
          sleep 6
          if ! is_running; then
            echo "App not running after first launch attempt, retrying once..."
            xcrun simctl launch "$UDID" com.stservice.stvpn || true
            sleep 6
          fi
          if is_running; then
            echo "still_running=true" >> "$GITHUB_OUTPUT"
          else
            echo "still_running=false" >> "$GITHUB_OUTPUT"
            echo "::warning::App does not appear to be running after launch — likely crashed. Collecting diagnostics."
          fi

      - name: Collect crash diagnostics
        if: steps.launch.outputs.still_running == 'false'
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          echo "--- Recent crash reports (DiagnosticReports) ---"
          find "$HOME/Library/Logs/DiagnosticReports" -iname "*Everywhere*" -newermt '-5 minutes' -exec echo {} \; -exec cat {} \; 2>/dev/null || true
          echo "--- Recent unified log for the process ---"
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Everywhere"' 2>/dev/null | tail -300 || true

      - name: Screenshot opening screen
        run: xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot screenshot.png

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: stvpn-opening-screen
          path: screenshot.png

      - name: Embed screenshot in job summary
        run: |
          sips -Z 600 -s format jpeg -s formatOptions 70 screenshot.png --out screenshot-thumb.jpg
          {
            echo "### STVPN opening screen"
            echo
            if [ "${{ steps.launch.outputs.still_running }}" = "false" ]; then
              echo "**Warning:** app was not running when this screenshot was taken (see \"Collect crash diagnostics\" step above)."
              echo
            fi
            echo "![screenshot](data:image/jpeg;base64,$(base64 -i screenshot-thumb.jpg | tr -d '\n'))"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Shut down simulator
        if: always()
        run: xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true
