name: Build & Screenshot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-screenshot:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write # needed to push the screenshot to the `screenshots` branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Available Xcode installs:"
          ls -d /Applications/Xcode*.app
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i simulator

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Everywhere.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache Xcode build products (incremental build)
        uses: actions/cache@v4
        with:
          path: |
            DerivedData/Build
            DerivedData/ModuleCache.noindex
          key: build-${{ runner.os }}-${{ hashFiles('Everywhere/**/*.swift', 'EverywhereNE/**/*.swift', 'Shared/**/*.swift', 'Everywhere.xcodeproj/project.pbxproj') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Install xcodeproj gem
        run: gem install --user-install xcodeproj

      - name: Wire project (SwiftPM deps, zashboard resource, build settings)
        run: ruby Scripts/wire_project.rb

      - name: Build for iOS Simulator
        run: |
          # Ad-hoc sign (identity "-") rather than CODE_SIGNING_ALLOWED=NO: the
          # Simulator needs no certificate/provisioning profile, but it does need
          # *some* signature for entitlements (App Group, in particular) to be
          # embedded and resolved at runtime — without it EVCore.containerURL's
          # containerURL(forSecurityApplicationGroupIdentifier:) returns nil.
          xcodebuild \
            -project Everywhere.xcodeproj \
            -scheme Everywhere \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Boot simulator (reuse pre-provisioned device if possible)
        id: sim
        run: |
          set -euo pipefail
          RUNTIME_ID=$(xcrun simctl list runtimes available -j | \
            jq -r '[.runtimes[] | select(.name | startswith("iOS"))] | sort_by(.version) | last | .identifier')
          echo "Runtime: $RUNTIME_ID"

          # Runner images ship with a handful of simulators already created for the
          # default Xcode — booting one of those skips the ~60-70s first-boot data
          # migration that `simctl create` pays on a brand new device. Fall back to
          # creating one if none exist for the runtime we picked (e.g. it's newer
          # than the image's bundled default).
          UDID=$(xcrun simctl list devices available -j | \
            jq -r --arg rid "$RUNTIME_ID" \
            '.devices[$rid] // [] | map(select(.name | startswith("iPhone"))) | .[0].udid // empty')

          if [ -z "$UDID" ]; then
            echo "No pre-provisioned device for $RUNTIME_ID — creating one."
            DEVICE_TYPE_ID=$(xcrun simctl list runtimes available -j | \
              jq -r --arg rid "$RUNTIME_ID" \
              '.runtimes[] | select(.identifier==$rid) | .supportedDeviceTypes | map(select(.name | startswith("iPhone"))) | last | .identifier')
            echo "DeviceType: $DEVICE_TYPE_ID"
            UDID=$(xcrun simctl create STVPN-CI "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          else
            echo "Reusing pre-provisioned device: $UDID"
          fi

          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install & launch app
        id: launch
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP_PATH=$(find DerivedData -name "Everywhere.app" -path "*iphonesimulator*" -print -quit)
          echo "App path: $APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"

          is_running() {
            xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "com.stservice.stvpn"
          }

          # Note: TunnelManager has a DEBUG-only STVPN_FAKE_RUNNING escape hatch
          # (set SIMCTL_CHILD_STVPN_FAKE_RUNNING=1 here to use it) that skips
          # straight to the running/dashboard UI. Left off by default — it jumps
          # into zashboard with no real backend behind it, which just shows
          # zashboard's own "configure a connection" onboarding, not what a real
          # user sees. The plain Home tab below is the accurate opening screen.

          xcrun simctl launch "$UDID" com.stservice.stvpn
          sleep 6
          if ! is_running; then
            echo "App not running after first launch attempt, retrying once..."
            xcrun simctl launch "$UDID" com.stservice.stvpn || true
            sleep 6
          fi
          if is_running; then
            echo "still_running=true" >> "$GITHUB_OUTPUT"
          else
            echo "still_running=false" >> "$GITHUB_OUTPUT"
            echo "::warning::App does not appear to be running after launch — likely crashed. Collecting diagnostics."
          fi

      - name: Collect crash diagnostics
        if: steps.launch.outputs.still_running == 'false'
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          echo "--- Recent crash reports (DiagnosticReports) ---"
          find "$HOME/Library/Logs/DiagnosticReports" -iname "*Everywhere*" -newermt '-5 minutes' -exec echo {} \; -exec cat {} \; 2>/dev/null || true
          echo "--- Recent unified log for the process ---"
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Everywhere"' 2>/dev/null | tail -300 || true

      - name: Screenshot opening screen
        run: xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot screenshot-login.png

      - name: Install Maestro + idb (UI automation for the login flow)
        run: |
          brew tap facebook/fb
          brew install facebook/fb/idb-companion
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run login flow with Maestro (type node code, log in, screenshot Main)
        id: maestro
        continue-on-error: true # best-effort: don't let a flaky UI-automation step sink the login screenshot we already have
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --device "${{ steps.sim.outputs.udid }}" test .maestro/login-to-main.yaml

          # `takeScreenshot: main-view` writes into Maestro's own per-run
          # report dir (~/.maestro/tests/<timestamp>/), not the cwd — search
          # there first, then fall back to a broad search with full listing
          # for debugging if it's moved again in a future Maestro version.
          SHOT=$(find "$HOME/.maestro/tests" -iname "main-view.png" -newermt '-5 minutes' -print -quit 2>/dev/null)
          if [ -z "$SHOT" ]; then
            SHOT=$(find . "$HOME" /tmp -iname "main-view.png" -newermt '-5 minutes' -print -quit 2>/dev/null)
          fi
          if [ -z "$SHOT" ]; then
            echo "::warning::main-view.png not found after the Maestro flow completed. Recent .png files, for debugging:"
            find "$HOME" /tmp . -iname "*.png" -newermt '-5 minutes' 2>/dev/null
            exit 1
          fi
          echo "Found screenshot at: $SHOT"
          cp "$SHOT" screenshot-main.png
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Upload screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stvpn-screenshots
          path: |
            screenshot-login.png
            screenshot-main.png
          if-no-files-found: ignore

      - name: Publish screenshots to screenshots branch (stable direct links)
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORKDIR=$(mktemp -d)
          git -C "$WORKDIR" init -q
          git -C "$WORKDIR" checkout -q --orphan screenshots
          git -C "$WORKDIR" config user.name "github-actions[bot]"
          git -C "$WORKDIR" config user.email "github-actions[bot]@users.noreply.github.com"
          cp screenshot-login.png "$WORKDIR/screenshot-login.png"
          git -C "$WORKDIR" add screenshot-login.png
          if [ -f screenshot-main.png ]; then
            cp screenshot-main.png "$WORKDIR/screenshot-main.png"
            git -C "$WORKDIR" add screenshot-main.png
          fi
          git -C "$WORKDIR" commit -q -m "Screenshots from run ${{ github.run_id }}"
          git -C "$WORKDIR" push -q -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            HEAD:screenshots
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/screenshots"
          echo "login_url=$BASE/screenshot-login.png" >> "$GITHUB_OUTPUT"
          echo "main_url=$BASE/screenshot-main.png" >> "$GITHUB_OUTPUT"

      - name: Embed screenshots in job summary
        run: |
          sips -Z 600 -s format jpeg -s formatOptions 70 screenshot-login.png --out screenshot-login-thumb.jpg
          {
            echo "### Login screen"
            echo
            echo "Direct link (always latest): ${{ steps.publish.outputs.login_url }}"
            echo
            if [ "${{ steps.launch.outputs.still_running }}" = "false" ]; then
              echo "**Warning:** app was not running when this screenshot was taken (see \"Collect crash diagnostics\" step above)."
              echo
            fi
            echo "![login screenshot](data:image/jpeg;base64,$(base64 -i screenshot-login-thumb.jpg | tr -d '\n'))"
            echo
            echo "### Main screen (after Maestro login flow)"
            echo
            if [ -f screenshot-main.png ]; then
              sips -Z 600 -s format jpeg -s formatOptions 70 screenshot-main.png --out screenshot-main-thumb.jpg
              echo "Direct link (always latest): ${{ steps.publish.outputs.main_url }}"
              echo
              echo "![main screenshot](data:image/jpeg;base64,$(base64 -i screenshot-main-thumb.jpg | tr -d '\n'))"
            else
              echo "**The Maestro login flow didn't produce a screenshot this run** — see the \"Run login flow with Maestro\" step's log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Shut down simulator
        if: always()
        run: xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true
