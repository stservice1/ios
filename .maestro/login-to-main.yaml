# Maestro flow: types the node code, logs in, and waits (non-fatally) for
# the Main screen to appear, then screenshots whatever is on screen either
# way. Login now does real AliDNS TXT-record validation against the node
# code (see LoginViewModel) — if SC645888 isn't a currently valid code, the
# app correctly stays on LoginView with its real error banner instead of
# switching to Main. `extendedWaitUntil` + `optional: true` is used
# specifically so that outcome doesn't fail the flow (extendedWaitUntil
# alone still fails it on timeout, same as assertVisible — `optional` is
# what actually makes a failing command non-fatal): the screenshot itself
# is the diagnostic (Main view on success, Login view + error banner text
# on failure) rather than a hard pass/fail signal.
#
# Run against an already-booted Simulator with the app already installed
# (CI does both before invoking this).
#
# Local usage:
#   maestro test .maestro/login-to-main.yaml
appId: com.stservice.stvpn
---
- launchApp:
    clearState: true
- tapOn:
    id: "loginNodeCodeField"
- inputText: "SC645888"
- tapOn:
    id: "loginButton"
- extendedWaitUntil:
    visible:
      id: "stMainView"
    timeout: 30000
    optional: true
- takeScreenshot: main-view
